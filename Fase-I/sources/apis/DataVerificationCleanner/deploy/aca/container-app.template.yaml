# Plantilla para: az containerapp create --yaml @container-app.template.yaml
# Reemplazá los marcadores <...> antes de aplicar. No commitees secretos.
---
kind: containerapp
location: <LOCATION>
name: data-verification-cleaner
resourceGroup: <RESOURCE_GROUP_NAME>
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: <MANAGED_ENVIRONMENT_RESOURCE_ID>
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 5001
      transport: Auto
    # Registro ACR: configurá `registries` + identidad o usuario admin (ver DEPLOY_AZURE_ACA.md).
    # Secretos: preferí `az containerapp secret set` en lugar de listarlos aquí.
    secrets: []
  template:
    scale:
      minReplicas: 0
      maxReplicas: 2
    containers:
      - name: api
        image: <ACR_NAME>.azurecr.io/data-verification-cleaner:1.0.0
        resources:
          cpu: 1.0
          memory: 2.0Gi
        env:
          - name: PORT
            value: "5001"
          - name: FLASK_ENV
            value: production
          - name: FLASK_DEBUG
            value: "false"
          # Añadí el resto de variables y secretref según docs/DEPLOY_AZURE_ACA.md
        probes:
          - type: Startup
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          - type: Liveness
            httpGet:
              path: /health
              port: 5001
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          - type: Readiness
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
