[project]
name = "metricprocessor"
version = "0.1.0"
description = "Metric Calculation – Calcula y persiste los KPIs mensuales para el dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.0",
    "flask-cors==5.0.0",
    "psycopg2-binary>=2.9",
    "pytest>=8.3",
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
